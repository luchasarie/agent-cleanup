<svg xmlns="http://www.w3.org/2000/svg" width="900" height="112" viewBox="0 0 900 112" role="img" aria-labelledby="t">
<title id="t">How agent-cleanup works: scan, classify, confirm, apply</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
<rect x="4" y="4" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="32" cy="34" r="13" fill="#12301c"/>
<text x="32" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">1</text>
<text x="54" y="40" font-size="17" font-weight="600" fill="#e6edf3">Scan</text>
<text x="20" y="72" font-size="12.5" fill="#9198a1">sweeps repos, worktrees,</text>
<text x="20" y="90" font-size="12.5" fill="#9198a1">caches, logs; deletes nothing</text>
<line x1="206" y1="56.0" x2="230" y2="56.0" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="236" y="4" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="264" cy="34" r="13" fill="#12301c"/>
<text x="264" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">2</text>
<text x="286" y="40" font-size="17" font-weight="600" fill="#e6edf3">Classify</text>
<text x="252" y="72" font-size="12.5" fill="#9198a1">REMOVE · NEEDS-DECISION</text>
<text x="252" y="90" font-size="12.5" fill="#9198a1">KEEP-ACTIVE · SKIP</text>
<line x1="438" y1="56.0" x2="462" y2="56.0" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="468" y="4" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="496" cy="34" r="13" fill="#12301c"/>
<text x="496" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">3</text>
<text x="518" y="40" font-size="17" font-weight="600" fill="#e6edf3">Confirm</text>
<text x="484" y="72" font-size="12.5" fill="#9198a1">one question; safe items</text>
<text x="484" y="90" font-size="12.5" fill="#9198a1">pre-selected</text>
<line x1="670" y1="56.0" x2="694" y2="56.0" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="700" y="4" width="196" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="728" cy="34" r="13" fill="#12301c"/>
<text x="728" y="39" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">4</text>
<text x="750" y="40" font-size="17" font-weight="600" fill="#e6edf3">Apply</text>
<text x="716" y="72" font-size="12.5" fill="#9198a1">re-check each item,</text>
<text x="716" y="90" font-size="12.5" fill="#9198a1">skip anything that changed</text>
</svg>